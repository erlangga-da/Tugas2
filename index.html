<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login SITTA</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/login.css">
</head>

<body>
    <div class="container">
        <div class="content">
            <div class="text-container">
                <img src="./assets/Login.svg" width="48" height="48" alt="">
                <h1>Selamat Datang</h1>
                <p>Masuk untuk mulai menggunakan aplikasi</p>
            </div>
            <form action="" method="" id="login-input">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <a id="forgot" href="#" onclick="alert('Silahkan hubungi Administrator untuk mereset password.')">Lupa password ?</a>
                <button type="submit">Masuk</button>
            </form>
        </div>
        <div class="link-signup">
            <p>Belum punya akun?</p>
            <a id="daftar" href="#"
                onclick="alert('Silahkan hubungi Administrator untuk pendaftaran akun resmi SITTA.')">Daftar</a>
        </div>
    </div>
    <script src="./js/data.js"></script>
    <script type="module" src="./js/script.js"></script>
</body>

</html>
